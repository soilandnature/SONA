<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --white: #ffffff;
    --black: #0f0f0f;
    --gray-50: #fafaf9;
    --gray-100: #f4f4f2;
    --gray-200: #e8e8e4;
    --gray-400: #a8a8a2;
    --gray-600: #6b6b65;
    --gray-800: #2e2e2b;
    --accent: #1a1a1a;
    --tag-bg: #f0ede8;
    --tag-text: #3d3b35;
    --radius: 2px;
    --radius-lg: 4px;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--white);
    color: var(--black);
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  /* HEADER */
  header {
    border-bottom: 1px solid var(--gray-200);
    padding: 0 2.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 64px;
    position: sticky;
    top: 0;
    background: var(--white);
    z-index: 100;
  }

  .logo {
    font-family: 'DM Serif Display', serif;
    font-size: 22px;
    color: var(--black);
    text-decoration: none;
    letter-spacing: -0.3px;
  }

  .logo em {
    font-style: italic;
    color: var(--gray-600);
  }

  nav {
    display: flex;
    gap: 2rem;
    align-items: center;
  }

  nav a {
    font-size: 13px;
    color: var(--gray-600);
    text-decoration: none;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    transition: color 0.2s;
  }

  nav a:hover { color: var(--black); }

  .nav-icons {
    display: flex;
    gap: 1.25rem;
    align-items: center;
  }

  .nav-icons button {
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px;
    color: var(--gray-600);
    transition: color 0.2s;
    display: flex;
  }

  .nav-icons button:hover { color: var(--black); }

  .cart-badge {
    position: relative;
  }

  .cart-badge span {
    position: absolute;
    top: -4px;
    right: -4px;
    background: var(--black);
    color: var(--white);
    font-size: 9px;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 500;
  }

  /* HERO */
  .hero {
    padding: 5rem 2.5rem 4rem;
    max-width: 640px;
  }

  .hero-tag {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--gray-400);
    margin-bottom: 1rem;
  }

  .hero h1 {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(2.5rem, 5vw, 3.75rem);
    line-height: 1.05;
    letter-spacing: -1px;
    color: var(--black);
    margin-bottom: 1.25rem;
  }

  .hero h1 em {
    font-style: italic;
    color: var(--gray-600);
  }

  .hero p {
    font-size: 16px;
    color: var(--gray-600);
    font-weight: 300;
    max-width: 420px;
    line-height: 1.7;
  }

  /* FILTER BAR */
  .filter-bar {
    padding: 0 2.5rem 1.5rem;
    display: flex;
    gap: 0.5rem;
    align-items: center;
    border-bottom: 1px solid var(--gray-200);
    flex-wrap: wrap;
  }

  .filter-label {
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--gray-400);
    margin-right: 0.5rem;
  }

  .filter-btn {
    background: none;
    border: 1px solid var(--gray-200);
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    color: var(--gray-600);
    padding: 5px 14px;
    border-radius: 40px;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.02em;
  }

  .filter-btn:hover {
    border-color: var(--gray-400);
    color: var(--black);
  }

  .filter-btn.active {
    background: var(--black);
    color: var(--white);
    border-color: var(--black);
  }

  /* PRODUCT GRID */
  .grid-wrapper {
    padding: 2.5rem;
  }

  .grid-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1.75rem;
  }

  .grid-count {
    font-size: 13px;
    color: var(--gray-400);
  }

  .sort-select {
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    color: var(--gray-600);
    border: 1px solid var(--gray-200);
    background: var(--white);
    padding: 5px 12px;
    border-radius: 2px;
    cursor: pointer;
    outline: none;
  }

  .products-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 1px;
    background: var(--gray-200);
    border: 1px solid var(--gray-200);
  }

  /* PRODUCT CARD */
  .product-card {
    background: var(--white);
    cursor: pointer;
    transition: background 0.15s;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  .product-card:hover { background: var(--gray-50); }

  .product-card:hover .card-actions { opacity: 1; }

  .card-image {
    aspect-ratio: 4/5;
    background: var(--gray-100);
    overflow: hidden;
    position: relative;
  }

  .card-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.4s ease;
  }

  .product-card:hover .card-image img {
    transform: scale(1.03);
  }

  .card-tag {
    position: absolute;
    top: 12px;
    left: 12px;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    background: var(--white);
    color: var(--black);
    padding: 3px 8px;
    font-weight: 500;
  }

  .card-tag.new { background: var(--black); color: var(--white); }
  .card-tag.sale { background: #c5291e; color: var(--white); }

  .card-actions {
    position: absolute;
    bottom: 12px;
    left: 12px;
    right: 12px;
    opacity: 0;
    transition: opacity 0.2s;
  }

  .btn-add {
    width: 100%;
    background: var(--white);
    border: none;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--black);
    padding: 10px;
    cursor: pointer;
    font-weight: 500;
    transition: background 0.15s, color 0.15s;
  }

  .btn-add:hover {
    background: var(--black);
    color: var(--white);
  }

  .btn-add.added {
    background: var(--black);
    color: var(--white);
  }

  .card-info {
    padding: 1rem 1rem 1.25rem;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .card-category {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--gray-400);
  }

  .card-name {
    font-size: 14px;
    font-weight: 500;
    color: var(--black);
    letter-spacing: -0.1px;
  }

  .card-price-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 4px;
  }

  .card-price {
    font-size: 14px;
    font-weight: 500;
    color: var(--black);
  }

  .card-price-original {
    font-size: 13px;
    color: var(--gray-400);
    text-decoration: line-through;
  }

  .card-rating {
    display: flex;
    gap: 2px;
    align-items: center;
    margin-top: 2px;
  }

  .stars {
    font-size: 11px;
    color: #c8a951;
    letter-spacing: 1px;
  }

  .rating-count {
    font-size: 11px;
    color: var(--gray-400);
  }

  /* wishlist */
  .btn-wish {
    position: absolute;
    top: 10px;
    right: 10px;
    background: var(--white);
    border: none;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--gray-400);
    opacity: 0;
    transition: opacity 0.2s, color 0.15s;
  }

  .product-card:hover .btn-wish { opacity: 1; }
  .btn-wish:hover { color: #c5291e; }
  .btn-wish.wished { color: #c5291e; opacity: 1 !important; }

  /* FOOTER */
  footer {
    border-top: 1px solid var(--gray-200);
    padding: 2rem 2.5rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 3rem;
    flex-wrap: wrap;
    gap: 1rem;
  }

  .footer-logo {
    font-family: 'DM Serif Display', serif;
    font-size: 16px;
    color: var(--black);
  }

  .footer-links {
    display: flex;
    gap: 1.75rem;
  }

  .footer-links a {
    font-size: 12px;
    color: var(--gray-400);
    text-decoration: none;
    letter-spacing: 0.03em;
    transition: color 0.15s;
  }

  .footer-links a:hover { color: var(--black); }

  .footer-copy {
    font-size: 12px;
    color: var(--gray-400);
  }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%) translateY(8px);
    background: var(--black);
    color: var(--white);
    font-size: 13px;
    padding: 10px 20px;
    opacity: 0;
    transition: opacity 0.25s, transform 0.25s;
    pointer-events: none;
    white-space: nowrap;
    z-index: 999;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* RESPONSIVE */
  @media (max-width: 640px) {
    header { padding: 0 1.25rem; }
    nav { display: none; }
    .hero { padding: 3rem 1.25rem 2.5rem; }
    .filter-bar { padding: 0 1.25rem 1.25rem; }
    .grid-wrapper { padding: 1.5rem 1.25rem; }
    footer { padding: 1.5rem 1.25rem; flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <a class="logo" href="#">Maison<em>.</em></a>
  <nav>
    <a href="#">New In</a>
    <a href="#">Clothing</a>
    <a href="#">Accessories</a>
    <a href="#">Sale</a>
  </nav>
  <div class="nav-icons">
    <button aria-label="Search">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
    </button>
    <button class="cart-badge" aria-label="Cart" id="cart-btn">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
      <span id="cart-count">0</span>
    </button>
  </div>
</header>

<!-- HERO -->
<section class="hero">
  <p class="hero-tag">Spring — Summer 2025</p>
  <h1>Quiet <em>luxury,</em><br>every day.</h1>
  <p>Thoughtfully crafted essentials for the modern wardrobe. Timeless pieces made to last.</p>
</section>

<!-- FILTER BAR -->
<div class="filter-bar">
  <span class="filter-label">Filter</span>
  <button class="filter-btn active" data-filter="all">All</button>
  <button class="filter-btn" data-filter="clothing">Clothing</button>
  <button class="filter-btn" data-filter="accessories">Accessories</button>
  <button class="filter-btn" data-filter="footwear">Footwear</button>
  <button class="filter-btn" data-filter="sale">On Sale</button>
</div>

<!-- GRID -->
<div class="grid-wrapper">
  <div class="grid-header">
    <span class="grid-count" id="grid-count">12 items</span>
    <select class="sort-select" id="sort-select">
      <option value="featured">Featured</option>
      <option value="price-asc">Price: low to high</option>
      <option value="price-desc">Price: high to low</option>
      <option value="newest">Newest</option>
    </select>
  </div>
  <div class="products-grid" id="products-grid"></div>
</div>

<!-- FOOTER -->
<footer>
  <span class="footer-logo">Maison.</span>
  <div class="footer-links">
    <a href="#">About</a>
    <a href="#">Shipping</a>
    <a href="#">Returns</a>
    <a href="#">Contact</a>
  </div>
  <span class="footer-copy">© 2025 Maison</span>
</footer>

<div class="toast" id="toast"></div>

<script>
const products = [
  { id:1, name:"Linen Overshirt", category:"clothing", price:128, originalPrice:null, rating:4.8, reviews:42, tag:"new", image:"https://images.unsplash.com/photo-1602810318383-e386cc2a3ccf?w=500&q=80" },
  { id:2, name:"Wide-Leg Trousers", category:"clothing", price:96, originalPrice:148, rating:4.6, reviews:28, tag:"sale", image:"https://images.unsplash.com/photo-1594938298603-c8148c4dae35?w=500&q=80" },
  { id:3, name:"Merino Crew Knit", category:"clothing", price:145, originalPrice:null, rating:4.9, reviews:67, tag:null, image:"https://images.unsplash.com/photo-1434389677669-e08b4cac3105?w=500&q=80" },
  { id:4, name:"Leather Belt", category:"accessories", price:68, originalPrice:null, rating:4.7, reviews:19, tag:null, image:"https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=500&q=80" },
  { id:5, name:"Canvas Tote", category:"accessories", price:54, originalPrice:null, rating:4.5, reviews:33, tag:"new", image:"https://images.unsplash.com/photo-1590874103328-eac38a683ce7?w=500&q=80" },
  { id:6, name:"Derby Shoes", category:"footwear", price:210, originalPrice:265, rating:4.8, reviews:51, tag:"sale", image:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500&q=80" },
  { id:7, name:"Silk Scarf", category:"accessories", price:82, originalPrice:null, rating:4.4, reviews:14, tag:null, image:"https://images.unsplash.com/photo-1601924994987-69e26d50dc26?w=500&q=80" },
  { id:8, name:"Relaxed Chinos", category:"clothing", price:112, originalPrice:null, rating:4.6, reviews:39, tag:null, image:"https://images.unsplash.com/photo-1473966968600-fa801b869a1a?w=500&q=80" },
  { id:9, name:"Suede Loafers", category:"footwear", price:195, originalPrice:null, rating:4.9, reviews:88, tag:"new", image:"https://images.unsplash.com/photo-1522771739844-6a9f6d5f14af?w=500&q=80" },
  { id:10, name:"Wool Overcoat", category:"clothing", price:385, originalPrice:490, rating:4.8, reviews:24, tag:"sale", image:"https://images.unsplash.com/photo-1539533018447-63fcce2678e3?w=500&q=80" },
  { id:11, name:"Minimalist Watch", category:"accessories", price:245, originalPrice:null, rating:4.7, reviews:62, tag:null, image:"https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500&q=80" },
  { id:12, name:"Chelsea Boots", category:"footwear", price:228, originalPrice:null, rating:4.6, reviews:45, tag:null, image:"https://images.unsplash.com/photo-1608256246200-53e635b5b65f?w=500&q=80" },
];

let cartCount = 0;
let currentFilter = 'all';
let wished = new Set();

function renderStars(rating) {
  const full = Math.floor(rating);
  const half = rating % 1 >= 0.5 ? 1 : 0;
  return '★'.repeat(full) + (half ? '½' : '') + '☆'.repeat(5 - full - half);
}

function renderProducts(list) {
  const grid = document.getElementById('products-grid');
  document.getElementById('grid-count').textContent = list.length + ' item' + (list.length !== 1 ? 's' : '');
  grid.innerHTML = list.map(p => `
    <div class="product-card">
      <div class="card-image">
        <img src="${p.image}" alt="${p.name}" loading="lazy">
        ${p.tag ? `<span class="card-tag ${p.tag}">${p.tag === 'new' ? 'New' : 'Sale'}</span>` : ''}
        <div class="card-actions">
          <button class="btn-add" onclick="addToCart(${p.id}, this)"data-id="${p.id}">Add to cart</button>
        </div>
      </div>
      <button class="btn-wish ${wished.has(p.id) ? 'wished' : ''}" onclick="toggleWish(${p.id}, this)" aria-label="Wishlist">
        <svg width="14" height="14" fill="${wished.has(p.id) ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78z"/></svg>
      </button>
      <div class="card-info">
        <span class="card-category">${p.category}</span>
        <span class="card-name">${p.name}</span>
        <div class="card-price-row">
          <span class="card-price">$${p.price}</span>
          ${p.originalPrice ? `<span class="card-price-original">$${p.originalPrice}</span>` : ''}
        </div>
        <div class="card-rating">
          <span class="stars">${renderStars(p.rating)}</span>
          <span class="rating-count">(${p.reviews})</span>
        </div>
      </div>
    </div>
  `).join('');
}

function getFiltered() {
  let list = currentFilter === 'all' ? products :
             currentFilter === 'sale' ? products.filter(p => p.tag === 'sale') :
             products.filter(p => p.category === currentFilter);
  const sort = document.getElementById('sort-select').value;
  if (sort === 'price-asc') list = [...list].sort((a,b) => a.price - b.price);
  if (sort === 'price-desc') list = [...list].sort((a,b) => b.price - a.price);
  if (sort === 'newest') list = [...list].filter(p => p.tag === 'new').concat(list.filter(p => p.tag !== 'new'));
  return list;
}

function addToCart(id, btn) {
  cartCount++;
  document.getElementById('cart-count').textContent = cartCount;
  btn.textContent = 'Added ✓';
  btn.classList.add('added');
  setTimeout(() => { btn.textContent = 'Add to cart'; btn.classList.remove('added'); }, 1500);
  const p = products.find(x => x.id === id);
  showToast(p.name + ' added to cart');
}

function toggleWish(id, btn) {
  if (wished.has(id)) {
    wished.delete(id);
    btn.classList.remove('wished');
    btn.innerHTML = `<svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78z"/></svg>`;
  } else {
    wished.add(id);
    btn.classList.add('wished');
    btn.innerHTML = `<svg width="14" height="14" fill="currentColor" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78z"/></svg>`;
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderProducts(getFiltered());
  });
});

document.getElementById('sort-select').addEventListener('change', () => {
  renderProducts(getFiltered());
});

renderProducts(getFiltered());
</script>
</body>
</html>
